<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#13100C; --surface:#1c1812; --border:#2a2218;
    --fg:#E8D8B0; --muted:#8A7A5A; --gold:#c8a227;
    --e1-idle:#0D2A4A; --e1-run:#1A6A2A;
    --e2-idle:#2A0D4A; --e2-run:#1A6A2A;
    --go-idle:#0D3A1A; --go-run:#4A0D0D;
    --cd-idle:#4A0D0D; --cd-run:#1A6A2A;
    --amber:#FFA500; --red:#FF4444; --green:#44FF88;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  html,body { height:100%; background:var(--bg); color:var(--fg);
    font-family:'Rajdhani',sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none; user-select:none; overflow:hidden; }
  body { display:flex; flex-direction:column;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bot); }

  header { flex-shrink:0; padding:14px 20px 10px; text-align:center;
    border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; color:var(--gold); }
  header p  { font-size:11px; color:var(--muted); letter-spacing:.06em; margin-top:2px; }

  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr; gap:10px; padding:12px; min-height:0; }

  .timer-btn { position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:14px; cursor:pointer; padding:16px 12px;
    transition:transform .08s, background .25s; outline:none; overflow:hidden;
    -webkit-tap-highlight-color:transparent; }
  .timer-btn::before { content:''; position:absolute; inset:0;
    border-radius:inherit; opacity:0; transition:opacity .15s;
    background:rgba(255,255,255,.07); }
  .timer-btn:active::before { opacity:1; }
  .timer-btn:active { transform:scale(.96); }
  .timer-btn::after { content:''; position:absolute; top:0; left:12px; right:12px;
    height:1px; background:rgba(255,255,255,.12); border-radius:1px; }

  .btn-label  { font-size:13px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--fg); opacity:.85; }
  .btn-time   { font-family:'Share Tech Mono',monospace; font-size:28px;
    color:var(--fg); line-height:1; letter-spacing:.04em; }
  .btn-status { font-size:10px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--muted); height:14px; }

  .pulse-ring { display:none; position:absolute; inset:-3px; border-radius:17px;
    border:2px solid var(--green); opacity:.5;
    animation:pulse-ring 1.4s ease-out infinite; }
  .timer-btn.running .pulse-ring { display:block; }
  @keyframes pulse-ring {
    0%   { transform:scale(1);    opacity:.5; }
    70%  { transform:scale(1.02); opacity:.1; }
    100% { transform:scale(1);    opacity:.5; }
  }

  #btn-e1               { background:var(--e1-idle); }
  #btn-e1.running       { background:var(--e1-run); }
  #btn-e1.running .pulse-ring { border-color:#44aaff; }
  #btn-e1.amber         { background:#3a2800; }
  #btn-e1.danger        { background:#3a0808; }
  #btn-e1.done          { background:#3a0808; }

  #btn-e2               { background:var(--e2-idle); }
  #btn-e2.running       { background:var(--e2-run); }
  #btn-e2.running .pulse-ring { border-color:#cc88ff; }
  #btn-e2.amber         { background:#3a2800; }
  #btn-e2.danger        { background:#3a0808; }
  #btn-e2.done          { background:#3a0808; }

  #btn-start            { background:var(--go-idle); }
  #btn-start.running    { background:var(--go-run); }
  #btn-start .btn-time  { font-family:'Rajdhani',sans-serif; font-size:20px;
    font-weight:700; letter-spacing:.06em; }

  #btn-cd               { background:var(--cd-idle); }
  #btn-cd.running       { background:var(--cd-run); }
  #btn-cd.amber         { background:#3a2800; }
  #btn-cd.danger        { background:#3a0808; }
  #btn-cd.done          { background:#3a0808; }

  .timer-btn.amber  .btn-time { color:var(--amber); }
  .timer-btn.danger .btn-time { color:var(--red); }
  .timer-btn.done   .btn-time { color:var(--red); }
  .timer-btn.done   .btn-status { color:var(--red); }

  @keyframes done-flash { 0%,100%{opacity:1} 50%{opacity:.4} }
  .timer-btn.done .btn-time { animation:done-flash .6s ease-in-out infinite; }

  #btn-start:not(.running) .btn-time { color:var(--green); }
  #btn-start.running        .btn-time { color:var(--red); }

  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,.06) 0px,rgba(0,0,0,.06) 1px,transparent 1px,transparent 3px); }
</style>
</head>
<body>

<header>
  <h1>Etta Doyle Timer</h1>
  <p>RDO — Maximise payout</p>
</header>

<div class="grid">
  <button class="timer-btn" id="btn-e1" onclick="toggleE1()">
    <div class="pulse-ring"></div>
    <span class="btn-label">Etta 1</span>
    <span class="btn-time" id="e1-time">4:10</span>
    <span class="btn-status" id="e1-status">tap to start</span>
  </button>

  <button class="timer-btn" id="btn-e2" onclick="toggleE2()">
    <div class="pulse-ring"></div>
    <span class="btn-label">Etta 2</span>
    <span class="btn-time" id="e2-time">31:00</span>
    <span class="btn-status" id="e2-status">tap to start</span>
  </button>

  <button class="timer-btn" id="btn-start" onclick="toggleStart()">
    <div class="pulse-ring"></div>
    <span class="btn-label" id="start-label">Start</span>
    <span class="btn-time" id="start-icon">▶ Both</span>
    <span class="btn-status" id="start-status">etta 1 + etta 2</span>
  </button>

  <button class="timer-btn" id="btn-cd" onclick="toggleCd()">
    <div class="pulse-ring"></div>
    <span class="btn-label">Cooldown</span>
    <span class="btn-time" id="cd-time">49:00</span>
    <span class="btn-status" id="cd-status">tap to start</span>
  </button>
</div>

<script>
// ── Durations (seconds) ───────────────────────────────────────────────────────
const FULL = { e1: 4*60+10, e2: 31*60, cd: 49*60 };

// ── State ─────────────────────────────────────────────────────────────────────
// startedAt = Date.now() when this timer last started
// baseRem   = remaining seconds at the moment it last started
// on        = currently running
// tid       = setInterval handle
const s = {
  e1: { on:false, baseRem:FULL.e1, startedAt:0, tid:null },
  e2: { on:false, baseRem:FULL.e2, startedAt:0, tid:null },
  cd: { on:false, baseRem:FULL.cd, startedAt:0, tid:null },
};

// ── Wall-clock remaining ──────────────────────────────────────────────────────
// Always derived from real time so backgrounding can't drift it.
function getRem(key) {
  const t = s[key];
  if (!t.on) return t.baseRem;
  const elapsed = Math.floor((Date.now() - t.startedAt) / 1000);
  return Math.max(0, t.baseRem - elapsed);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(secs) {
  secs = Math.max(0, secs);
  return `${Math.floor(secs/60)}:${(secs%60).toString().padStart(2,'0')}`;
}
function vib(p) { if (navigator.vibrate) navigator.vibrate(p); }
function alarm() {
  vib([300,150,300,150,300,150,300,150,300,150,300,150,
       300,150,300,150,300,150,300,150,300,150,300]);
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    let t = ctx.currentTime;
    for (let i=0;i<12;i++) {
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = i%2===0 ? 1000 : 1200;
      g.gain.setValueAtTime(0.8,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.38);
      o.start(t); o.stop(t+0.4); t+=0.42;
    }
  } catch(e){}
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTimer(key, btnId, timeId, statusId) {
  const rem = getRem(key);
  const t   = s[key];
  const btn = document.getElementById(btnId);
  btn.classList.remove('running','amber','danger','done');

  if (rem <= 0 && !t.on) {
    btn.classList.add('done');
    document.getElementById(timeId).textContent   = '⏰ DONE';
    document.getElementById(statusId).textContent = 'tap to reset';
    return;
  }
  document.getElementById(timeId).textContent = fmt(rem);
  if (t.on) {
    btn.classList.add('running');
    if      (rem <= 10) btn.classList.add('danger');
    else if (rem <= 30) btn.classList.add('amber');
    document.getElementById(statusId).textContent = 'running — tap to reset';
  } else {
    document.getElementById(statusId).textContent = 'tap to start';
  }
}

function renderStart() {
  const anyOn = s.e1.on || s.e2.on;
  const btn   = document.getElementById('btn-start');
  btn.classList.toggle('running', anyOn);
  document.getElementById('start-label').textContent = anyOn ? 'Stop'    : 'Start';
  document.getElementById('start-icon').textContent  = anyOn ? '■ Both'  : '▶ Both';
  document.getElementById('start-status').textContent= anyOn ? 'tap to reset both' : 'etta 1 + etta 2';
}

const rE1 = () => renderTimer('e1','btn-e1','e1-time','e1-status');
const rE2 = () => renderTimer('e2','btn-e2','e2-time','e2-status');
const rCd = () => renderTimer('cd','btn-cd','cd-time','cd-status');

// ── Tick: just re-render every second; getRem() does the real maths ───────────
function startTick(key, renderFn) {
  if (s[key].tid) { clearInterval(s[key].tid); s[key].tid = null; }
  s[key].tid = setInterval(() => {
    const rem = getRem(key);
    renderFn();
    if (key !== 'cd') renderStart();
    if (rem <= 0) {
      clearInterval(s[key].tid); s[key].tid = null;
      s[key].on = false;
      renderFn();
      renderStart();
      alarm();
    }
  }, 500); // 500ms so we never show a stale second after resume
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function reset(key, renderFn) {
  clearInterval(s[key].tid); s[key].tid = null;
  s[key].on       = false;
  s[key].baseRem  = FULL[key];
  s[key].startedAt= 0;
  renderFn();
  renderStart();
}

// ── Start ─────────────────────────────────────────────────────────────────────
function startTimer(key, renderFn) {
  s[key].baseRem   = FULL[key];
  s[key].startedAt = Date.now();
  s[key].on        = true;
  renderFn();
  renderStart();
  startTick(key, renderFn);
}

// ── Handlers ──────────────────────────────────────────────────────────────────
function toggleE1() {
  vib(30);
  s.e1.on || getRem('e1')<=0 ? reset('e1',rE1) : startTimer('e1',rE1);
}
function toggleE2() {
  vib(30);
  s.e2.on || getRem('e2')<=0 ? reset('e2',rE2) : startTimer('e2',rE2);
}
function toggleStart() {
  vib(30);
  if (s.e1.on || s.e2.on) {
    reset('e1',rE1); reset('e2',rE2);
  } else {
    startTimer('e1',rE1); startTimer('e2',rE2);
  }
}
function toggleCd() {
  vib(30);
  s.cd.on || getRem('cd')<=0 ? reset('cd',rCd) : startTimer('cd',rCd);
}

// ── Resume after backgrounding ────────────────────────────────────────────────
// When iOS resumes the page, intervals may have fired 0 or few times.
// We simply re-render — getRem() recalculates from wall-clock automatically.
// If any timer expired while backgrounded, fire the alarm immediately.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;

  ['e1','e2','cd'].forEach(key => {
    if (!s[key].on) return;
    const rem = getRem(key);
    if (rem <= 0) {
      // Expired in background — snap to done state
      clearInterval(s[key].tid); s[key].tid = null;
      s[key].on = false;
      alarm();
    }
  });

  rE1(); rE2(); rCd(); renderStart();
});

// ── Wake lock ─────────────────────────────────────────────────────────────────
(async () => {
  try {
    if ('wakeLock' in navigator)
      await navigator.wakeLock.request('screen');
  } catch(e){}
})();
</script>
</body>
</html>
